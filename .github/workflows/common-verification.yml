name: Common verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-common:
    name: Common and NMS Common (not full plugin)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify Common modules without private server build dependencies
        run: mvn -B -ntp -pl Common -am -Dmaven.javadoc.skip=true clean verify
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: common-test-reports
          path: '**/target/surefire-reports/*.xml'
          if-no-files-found: warn
