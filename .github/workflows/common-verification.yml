name: API verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-common:
    name: API package, tests and Javadocs (not server plugin)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build API library with tests and Javadocs using public dependencies
        run: mvn -B -ntp -pl Distribution/API -am clean verify
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: common-test-reports
          path: '**/target/surefire-reports/*.xml'
          if-no-files-found: warn
      - name: Preserve API library only (not an installable server plugin)
        uses: actions/upload-artifact@v4
        with:
          name: api-library-not-server-plugin
          path: 'Distribution/API/target/UltimateAdvancementAPI-*.jar'
          if-no-files-found: error
